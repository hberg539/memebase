[server]
host = "0.0.0.0"       # listen address
port = 5000            # listen port
max_upload_size = 100  # max upload size in MB (0 = unlimited)

[grid]
layout = "grid"       # "grid" or "masonry"
thumbnail_size = 220  # card width in pixels
per_page = "auto"     # number or "auto" to fill viewport

[ui]
theme = "midnight"

[thumbnails]
enabled = true        # generate and serve thumbnails in the grid
max_size = 440        # max width/height in px (2x default card size for retina)
quality = 80          # output quality (1-100)
format = "webp"       # "webp" or "jpeg"
skip_types = ["gif"]  # file extensions to skip, e.g. ["gif", "mp4"]

[ai]
enabled = false
# Any litellm-compatible model string works here. Examples:
# "anthropic/claude-sonnet-4-5-20250929"  # Anthropic (needs ANTHROPIC_API_KEY)
# "openai/gpt-4o"                         # OpenAI (needs OPENAI_API_KEY)
# "deepseek/deepseek-chat"                # DeepSeek (needs DEEPSEEK_API_KEY)
# "ollama/llama3.2-vision"                # Local Ollama (no key needed)
model = "anthropic/claude-sonnet-4-5-20250929"
parallel = 3  # max parallel requests for bulk auto-detect

prompt = """
You are a meme connoisseur analyzing a meme image. Be witty and think in classic meme language.
Respond with JSON only, no markdown:
{"name": "...", "description": "...", "tags": ["...", "..."]}

- name: a short, funny, descriptive filename (no extension, lowercase, use underscores)
- description: describe the meme so it's searchable -- include key visual elements, text on the image, the meme template name if recognizable, and the joke/context. Be slightly witty but prioritize findability over humor.
- tags: up to 5 short, lowercase tags for categorization and search. Prefer reusing existing tags from this list when they fit: {tags}. Only invent new tags when none of the existing ones apply.
"""
