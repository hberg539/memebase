<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="stylesheet" href="/themes/{{ theme }}.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>:root{--thumb-size:{{ grid_thumbnail_size }}px}</style>
</head>
<body>
{% block content %}{% endblock %}
<script>window.AI_PARALLEL = {{ ai_parallel }};window.GRID_PER_PAGE = {{ grid_per_page | tojson }};window.AI_ENABLED = {{ ai_enabled | tojson }};window.THUMBNAILS_ENABLED = {{ thumbnails_enabled | tojson }};window.THUMBNAILS_SKIP_TYPES = {{ thumbnails_skip_types | tojson }};window.THUMBNAILS_FORMAT = {{ thumbnails_format | tojson }};</script>
<script src="https://unpkg.com/lucide@1.41.0/dist/umd/lucide.min.js"></script>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/alerts.js') }}"></script>
<script src="{{ url_for('static', filename='js/dialog.js') }}"></script>
<script src="{{ url_for('static', filename='js/utils.js') }}"></script>
<script src="{{ url_for('static', filename='js/grid.js') }}"></script>
<script src="{{ url_for('static', filename='js/modal.js') }}"></script>
<script src="{{ url_for('static', filename='js/select.js') }}"></script>
<script src="{{ url_for('static', filename='js/autodetect.js') }}"></script>
<script src="{{ url_for('static', filename='js/upload.js') }}"></script>
<script src="{{ url_for('static', filename='js/collections.js') }}"></script>
</body>
</html>
